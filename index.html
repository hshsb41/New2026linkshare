<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0c10">
  <meta name="description" content="CKRPRO Gaming Tools Hub">
  <title>CKRPRO | Gaming Tools Hub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0b0c10;
      --surface: #14161d;
      --surface-high: #1f232e;
      --text: #f2f3f7;
      --muted: #8c93a6;
      --purple: #9b6dff;
      --cyan: #3cc8e8;
      --green: #19d77b;
      --ease: cubic-bezier(.22, 1, .36, 1);
      --spring: cubic-bezier(.34, 1.56, .64, 1);
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Plus Jakarta Sans", system-ui, -apple-system,
        "Segoe UI", Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 340px;
      margin: auto;
    }

    /* HEADER */
    .header {
      margin-bottom: 24px;
    }

    .title {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -1px;
    }

    .lead {
      margin-top: 9px;
      color: var(--muted);
      font-size: 12.5px;
      line-height: 1.6;
      font-weight: 500;
    }

    /* CARDS */
    .cards {
      display: grid;
      gap: 12px;
    }

    .card {
      --accent: var(--purple);

      position: relative;
      display: block;
      padding: 16px;
      border-radius: 19px;
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      overflow: hidden;
      isolation: isolate;
      -webkit-tap-highlight-color: transparent;
      transition:
        background .3s var(--ease),
        transform .3s var(--spring);
    }

    .card.cyan {
      --accent: var(--cyan);
    }

    .card.green {
      --accent: var(--green);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--accent);
      opacity: 0;
      transform: translateX(-101%);
      transition:
        transform .45s var(--ease),
        opacity .45s var(--ease);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .icon-box {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: var(--surface-high);
      color: var(--accent);
      transition:
        background .3s var(--ease),
        color .3s var(--ease),
        transform .4s var(--spring);
    }

    .icon-box svg {
      width: 21px;
      height: 21px;
    }

    .arrow {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--surface-high);
      color: var(--text);
      transition:
        background .3s var(--ease),
        color .3s var(--ease),
        transform .4s var(--spring);
    }

    .arrow svg {
      width: 14px;
      height: 14px;
    }

    .card h2 {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: -.3px;
      transition: color .3s var(--ease);
    }

    .card p {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      font-weight: 500;
      transition: color .3s var(--ease);
    }

    .card-action {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 15px;
      padding: 9px 13px;
      border-radius: 11px;
      background: var(--accent);
      color: #0b0c10;
      font-size: 12px;
      font-weight: 800;
      transition:
        background .3s var(--ease),
        color .3s var(--ease),
        transform .2s var(--ease);
    }

    .card-action svg {
      width: 12px;
      height: 12px;
      transition: transform .3s var(--spring);
    }

    /* HOVER */
    @media (hover: hover) {
      .card:hover {
        transform: translateY(-3px);
      }

      .card:hover::before {
        opacity: 1;
        transform: translateX(0);
      }

      .card:hover h2 {
        color: #0b0c10;
      }

      .card:hover p {
        color: #0b0c10;
        opacity: .75;
      }

      .card:hover .icon-box {
        background: #0b0c101f;
        color: #0b0c10;
        transform: rotate(-7deg) scale(1.05);
      }

      .card:hover .arrow {
        background: #0b0c10;
        color: var(--accent);
        transform: rotate(45deg);
      }

      .card:hover .card-action {
        background: #0b0c10;
        color: var(--text);
      }

      .card:hover .card-action svg {
        transform: translate(2px, -2px);
      }
    }

    .card:active {
      transform: scale(.98);
    }

    .card:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 3px;
    }

    /* FOOTER */
    .footer {
      margin-top: 25px;
      text-align: center;
      color: #62697b;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.8;
    }

    .footer strong {
      color: var(--muted);
      font-weight: 800;
    }

    /* ANIMATION */
    .reveal {
      opacity: 0;
      transform: translateY(20px);
      animation: rise .65s var(--spring) forwards;
      animation-delay: calc(var(--i) * 100ms + 80ms);
    }

    .reveal .icon-box {
      animation: pop .5s var(--spring) both;
      animation-delay: calc(var(--i) * 100ms + 250ms);
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pop {
      from {
        transform: scale(.7);
      }
      to {
        transform: scale(1);
      }
    }

    @media (max-width: 340px) {
      body {
        padding: 18px 12px;
      }

      .title {
        font-size: 24px;
      }

      .card {
        padding: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }

      .reveal {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
